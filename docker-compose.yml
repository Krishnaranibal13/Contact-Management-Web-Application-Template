services:

  postgres:
    image: postgres:17

    container_name: contact-postgres

    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - contact-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend

    container_name: contact-backend

    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - contact-network


  frontend:
    build:
      context: .

    container_name: contact-frontend

    restart: unless-stopped

    depends_on:
      - backend

    networks:
      - contact-network


  nginx:
    image: nginx:alpine

    container_name: contact-nginx

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - frontend
      - backend

    networks:
      - contact-network


networks:
  contact-network:
    driver: bridge


volumes:
  postgres_data:
